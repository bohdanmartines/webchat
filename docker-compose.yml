services:
  mysql:
    image: mysql:8.0
    container_name: webchat_mysql
    restart: always
    environment:
      MYSQL_DATABASE: webchat
      MYSQL_USER: webchat
      MYSQL_PASSWORD: webchatpwd
      MYSQL_ROOT_PASSWORD: rootpwd
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    depends_on:
      - mysql
    ports:
      - "9000:9000"
    environment:
      - DB_HOST=mysql

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"  # React served via nginx

volumes:
  mysql-data: